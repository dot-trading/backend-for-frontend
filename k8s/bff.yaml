apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-bff-api
  namespace: trading-ai
  labels:
    app: trading-bff-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-bff-api
  template:
    metadata:
      labels:
        app: trading-bff-api
    spec:
      containers:
      - name: trading-bff-api
        image: hsaii/trading-bff-api:latest
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /api/Status
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        ports:
        - containerPort: 8080
        envFrom:
          - configMapRef:
              name: service-endpoints
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: Persistence__BaseUrl
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: PERSISTENCE_SERVICE_URL
        - name: ThirdParty__BaseUrl
          valueFrom:
            configMapKeyRef:
              name: service-endpoints
              key: THIRD_PARTY_PROVIDER_URL
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
          requests:
            memory: "128Mi"
            cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: trading-bff-api
  namespace: trading-ai
  labels:
    app: trading-bff-api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: trading-bff-api
